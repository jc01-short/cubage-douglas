<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#195c35"><meta name="mobile-web-app-capable" content="yes">
<title>Cubage Douglas</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css">
</head><body><main class="app">
<header class="bar"><button id="back" class="secondary compact" hidden>← Retour</button><h1 id="appTitle">Cubage Douglas</h1><span id="status" class="pill wait">Initialisation…</span></header>
<div id="errorBox" class="error-box" hidden><b>Le démarrage a échoué.</b><span id="errorText"></span><button id="retry">Réessayer sans effacer les données</button></div>

<section id="home" class="view active">
 <div class="card"><h2>Parcelle active</h2><select id="parcelSelect"></select><button id="openParcel">Ouvrir la parcelle</button><button id="newParcel" class="secondary">Créer une parcelle</button></div>
 <div class="card"><button id="exportProfiles" class="secondary">Exporter les profils CSV</button><button id="exportTrees" class="secondary">Exporter le récapitulatif CSV</button><button id="backupJson" class="secondary">Sauvegarde complète JSON</button><label class="file-label">Restaurer une sauvegarde JSON<input id="restoreJson" type="file" accept="application/json,.json"></label></div>
</section>

<section id="parcelForm" class="view"><div class="card"><h2>Nouvelle parcelle</h2><label>Code ou nom<input id="parcelName" type="text" inputmode="text" autocomplete="off" placeholder="P12"></label><button id="saveParcel">Créer la parcelle</button><p id="parcelFormMsg" class="msg"></p></div></section>

<section id="parcelView" class="view">
 <div id="parcelSummary" class="card"></div>
 <div class="card collection"><div class="collection-head"><h2>Arbres</h2><span id="treeCount"></span></div><div id="treeList" class="tiles"></div><button id="newTree">+ Nouvel arbre</button></div>
 <div class="card collection"><div class="collection-head"><h2>Grumes</h2><span id="logCount"></span></div><div id="logList" class="tiles"></div><button id="newLog">+ Nouvelle grume</button></div>
 <button id="deleteParcel" class="danger">Supprimer cette parcelle</button>
</section>

<section id="itemForm" class="view"><div class="card"><h2 id="itemFormTitle">Nouvel arbre</h2>
 <div class="grid"><label id="numberLabel">Numéro<input id="itemNumber" type="text" inputmode="numeric" autocomplete="off"></label><label id="d130Label">D130 (cm)<input id="itemD130" type="number" inputmode="decimal" min="0.1" step="0.1"></label></div>
 <label id="lengthLabel">Htot (m)<input id="itemLength" type="number" inputmode="decimal" min="0.1" step="0.1"></label>
 <fieldset><legend>Intervalle entre les mesures</legend><div class="steps"><label><input type="radio" name="step" value="0.5">0,5 m</label><label><input type="radio" name="step" value="1" checked>1 m</label><label><input type="radio" name="step" value="2">2 m</label><label><input type="radio" name="step" value="4">4 m</label></div></fieldset>
 <p id="originNote" class="note"></p><button id="createItem">Créer et commencer le profil</button><p id="itemFormMsg" class="msg"></p></div></section>

<section id="profileView" class="view"><div class="card"><h2 id="profileTitle"></h2><div id="profileMeta" class="summary"></div><div class="next">Prochaine position<strong><span id="nextHeight">0</span> m</strong><small id="progress"></small></div>
 <div class="modebar"><button id="manualMode" class="active-mode">Saisie clavier</button><button id="voiceMode" class="secondary">🎤 Saisie vocale</button></div>
 <div id="manualPanel"><label>Diamètre (cm)<input id="diameter" class="diam" type="number" inputmode="decimal" min="0.1" step="0.1"></label><button id="addDiameter">Ajouter le diamètre</button></div>
 <div id="voicePanel" hidden><div class="voicebox"><button id="mic" class="mic">🎤</button><p id="voiceHelp">Appuie sur le micro et prononce le diamètre.</p><div id="voiceCandidate" hidden><label>Diamètre compris<input id="candidate" type="number" inputmode="decimal" step="0.1"></label><div class="actions"><button id="confirmVoice">Valider</button><button id="retryVoice" class="secondary">Modifier / recommencer</button></div></div></div></div>
 <div class="actions"><button id="undo" class="secondary">Annuler la dernière</button><button id="finish">Terminer</button></div><p id="profileMsg" class="msg"></p><h3>Mesures</h3><div id="measureList" class="list empty">Aucune mesure</div></div></section>

<section id="detailView" class="view"><div class="card"><h2 id="detailTitle"></h2><div id="detailMeta" class="summary"></div><div id="volumeRecap"></div><h3>Profil enregistré</h3><div id="detailMeasures" class="list"></div><button id="resumeItem">Reprendre ou corriger le profil</button><button id="deleteItem" class="danger">Supprimer cette saisie</button></div></section>
</main><script src="db.js"></script><script src="app.js"></script></body></html>
