<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#195c35"><title>Cubage Douglas V4.2</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><main><header><button id="back" hidden>←</button><button id="homeBtn">⌂</button><h1 id="title">Cubage Douglas</h1><span id="net">Prêt</span></header><div id="error" class="alert" hidden></div>
<section id="home" class="view active"><article><b class="badge">V4.2</b><h2>Parcelle active</h2><label>Parcelle<select id="parcelSelect"></select></label><div class="two"><button id="openParcel">Ouvrir</button><button id="newParcel" class="light">+ Parcelle</button></div></article><article><h2>Exports</h2><div class="two"><button id="exportProfiles" class="light">profils.csv</button><button id="exportItems" class="light">tiges.csv</button></div></article></section>
<section id="parcelForm" class="view"><article><h2>Nouvelle parcelle</h2><label>Code ou nom<input id="parcelName" autocomplete="off"></label><button id="saveParcel">Créer</button><p id="parcelMsg" class="msg"></p></article></section>
<section id="parcelView" class="view"><article id="parcelSummary"></article><article><h2>Nouvelle saisie</h2><div class="two"><button id="newTree">Arbre</button><button id="newLog" class="light">Grume</button></div></article><article id="classCard"><h2>Classes de diamètre</h2><div id="classes"></div></article><article><h2>Saisies</h2><div id="itemList"></div></article><button id="deleteParcel" class="danger">Supprimer la parcelle</button></section>
<section id="itemForm" class="view"><article><h2 id="formHeading"></h2><div class="two"><label>Numéro<input id="itemNumber" inputmode="numeric"></label><label id="d130Label">D130 (cm)<input id="d130" inputmode="decimal"></label></div><div id="logFields" hidden><div class="two"><label>Longueur (m)<input id="logLength" inputmode="decimal"></label><label>Pas<select id="step"><option>1</option><option>2</option><option>4</option></select></label></div><p class="hint">Profil depuis le gros bout. Volume conventionnel de Huber calculé avec le diamètre médian interpolé.</p></div><button id="createItem">Commencer le profil</button><p id="itemMsg" class="msg"></p></article></section>
<section id="profileView" class="view"><article id="profileHead"></article><article><h2>Diamètre à <span id="nextHeight"></span> m</h2><label>Diamètre (cm)<input id="diameter" inputmode="decimal" autocomplete="off"></label><div class="voice"><button id="voice" class="voiceBtn">🎙 Dicter</button><label class="switch"><input id="voiceAuto" type="checkbox" checked> Valider automatiquement la valeur reconnue</label></div><p id="voiceState" class="msg" aria-live="polite"></p><button id="addDiameter">Valider la mesure</button><div class="two"><button id="undo" class="light">Annuler la dernière</button><button id="finish" class="light">Terminer</button></div><p id="profileMsg" class="msg"></p></article><article><h2>Profil saisi</h2><div id="measureList"></div></article></section>
<section id="detailView" class="view"><article id="detail"></article><div class="actions3"><button id="resume" class="light">Reprendre</button><button id="newSame">+ Nouvelle tige</button><button id="deleteItem" class="danger">Supprimer</button></div></section>
<div id="endModal" class="modal" hidden><article><h2>Fin de tige</h2><label>Hauteur totale exacte (m)<input id="htot" inputmode="decimal"></label><label>Diamètre terminal (cm)<input id="terminal" inputmode="decimal"></label><label>Cime<select id="crown"><option value="complete">Complète</option><option value="broken">Cassée</option></select></label><div class="two"><button id="cancelEnd" class="light">Annuler</button><button id="confirmEnd">Enregistrer</button></div><p id="endMsg" class="msg"></p></article></div>
</main><script src="db.js"></script><script src="app.js"></script></body></html>
