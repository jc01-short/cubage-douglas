<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#195c35"><title>Cubage Douglas V4.1</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><button id="back" class="ghost" hidden>← Retour</button><button id="homeBtn" class="ghost">⌂ Accueil</button><h1 id="title">Cubage Douglas</h1><span id="status" class="pill">Initialisation</span></header><div id="error" class="alert" hidden></div>
<section id="home" class="view active"><div class="card"><span class="version">V4.1</span><h2>Parcelle active</h2><label>Parcelle<select id="parcelSelect"></select></label><div class="grid2"><button id="openParcel">Ouvrir</button><button id="newParcel" class="secondary">+ Nouvelle parcelle</button></div></div><div class="card"><h2>Exports</h2><div class="grid2"><button id="exportProfiles" class="secondary">profils.csv</button><button id="exportItems" class="secondary">tiges.csv</button></div></div><div class="card dangerbox"><h2>Réinitialisation</h2><button id="resetAll" class="danger">Tout effacer</button></div></section>
<section id="parcelForm" class="view"><div class="card"><h2>Nouvelle parcelle</h2><label>Code ou nom<input id="parcelName" autocomplete="off"></label><button id="saveParcel">Créer la parcelle</button><p id="parcelMsg" class="msg"></p></div></section>
<section id="parcelView" class="view"><div id="parcelSummary" class="card"></div><div class="card"><h2>Nouvelle saisie</h2><div class="grid2"><button id="newTree">Arbre</button><button id="newLog" class="secondary">Grume</button></div></div><div id="classCard" class="card"><h2>Classes de diamètre des arbres</h2><div id="classes"></div></div><div class="card"><h2>Saisies</h2><div id="itemList"></div></div><div class="card dangerbox"><button id="deleteParcel" class="danger">Supprimer la parcelle</button></div></section>
<section id="itemForm" class="view"><div class="card"><h2 id="formHeading"></h2><div class="grid2"><label>Numéro<input id="itemNumber" inputmode="numeric"></label><label id="d130Label">D130 (cm)<input id="d130" inputmode="decimal"></label></div><div id="logFields" hidden><div class="grid2"><label>Longueur (m)<input id="logLength" inputmode="decimal"></label><label>Pas de mesure<select id="step"><option value="1">1 m</option><option value="2">2 m</option><option value="4">4 m</option></select></label></div><p class="help">Mesure depuis le gros bout. Le diamètre médian sera estimé à mi-longueur par interpolation.</p></div><button id="createItem">Créer et commencer le profil</button><p id="itemMsg" class="msg"></p></div></section>
<section id="profileView" class="view"><div id="profileHead" class="card"></div><div class="card"><h2 id="measureTitle">Mesure</h2><p class="big"><span id="nextHeight"></span> m</p><label>Diamètre (cm)<input id="diameter" inputmode="decimal"></label><button id="addDiameter">Valider la mesure</button><div class="grid2"><button id="undo" class="secondary">Annuler la dernière</button><button id="finish" class="secondary">Terminer</button></div><p id="profileMsg" class="msg"></p></div><div class="card"><h2>Profil saisi</h2><div id="measureList"></div></div></section>
<section id="detailView" class="view"><div id="detail" class="card"></div><div class="grid2"><button id="resume" class="secondary">Reprendre</button><button id="deleteItem" class="danger">Supprimer</button></div></section>
<div id="endModal" class="modal" hidden><div class="card modalcard"><h2>Fin de tige</h2><label>Hauteur totale exacte (m)<input id="htot" inputmode="decimal"></label><label>Diamètre terminal (cm)<input id="terminal" inputmode="decimal"></label><label>Cime<select id="crown"><option value="complete">Complète</option><option value="broken">Cassée</option></select></label><div class="grid2"><button id="cancelEnd" class="secondary">Annuler</button><button id="confirmEnd">Enregistrer</button></div><p id="endMsg" class="msg"></p></div></div>
</main><script src="db.js"></script><script src="app.js"></script></body></html>
